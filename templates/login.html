<!DOCTYPE html>
<html>
<head>
    <title>Offline Messenger</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login-box">

    <h1>Offline Messenger</h1>

    <form action="/join" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        >

        <button type="submit">
            Join Chat
        </button>

    </form>

</div>

</body>
</html>
